<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Soal Kuis - UTBK / TKA Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Pustaka Mammoth.js untuk Menganalisis Dokumen Word (.docx / .docm) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    
    <style>
        body {
            background-color: #f3f4f6;
            color: #1f2937;
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        }
        .panel-bg {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
        }
        .inner-panel {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        .input-light {
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            color: #1f2937;
        }
        .input-light:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- HEADER UTBK STYLE -->
        <header class="bg-blue-900 text-white p-5 rounded-2xl shadow-md border-b-4 border-blue-600 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-800 p-3 rounded-xl text-amber-400 border border-blue-700">
                    <i class="fa-solid fa-pen-to-square text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-wide uppercase leading-tight">Editor Soal UTBK / TKA</h1>
                    <p class="text-xs text-blue-200 mt-0.5">Kelola bank soal, impor dari Tabel Word/JSON, dan unduh soal.json</p>
                </div>
            </div>
            
            <!-- Aksi JSON & Word: Impor dan Ekspor -->
            <div class="flex flex-wrap items-center gap-2">
                <!-- Input File Tersembunyi -->
                <input type="file" id="import-word-file" accept=".docm,.docx" onChange="importWordTable(event)" class="hidden">
                <input type="file" id="import-json-file" accept=".json" onChange="importJSON(event)" class="hidden">
                
                <!-- Tombol Upload Word Tabel -->
                <button onClick="document.getElementById('import-word-file').click()" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-xs md:text-sm flex items-center gap-2 transition border border-indigo-500 shadow-sm">
                    <i class="fa-solid fa-table"></i> Upload Word Tabel (.docm)
                </button>

                <!-- Tombol Upload JSON -->
                <button onClick="document.getElementById('import-json-file').click()" class="px-3.5 py-2 bg-blue-700 hover:bg-blue-800 text-white font-semibold rounded-lg text-xs md:text-sm flex items-center gap-2 transition border border-blue-600 shadow-sm">
                    <i class="fa-solid fa-file-import"></i> Upload JSON
                </button>

                <!-- Tombol Unduh JSON -->
                <button onClick="exportJSON()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-xs md:text-sm flex items-center gap-2 transition shadow-sm">
                    <i class="fa-solid fa-download"></i> Unduh soal.json
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT (GRID 2 KOLOM) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- KOLOM KIRI: FORM TAMBAH / EDIT SOAL -->
            <section class="lg:col-span-7 panel-bg p-6 rounded-2xl shadow-sm space-y-5">
                <h2 class="text-base font-bold text-slate-800 border-b border-slate-200 pb-3 flex items-center gap-2">
                    <i class="fa-solid fa-file-pen text-blue-700"></i> Tambah / Edit Soal
                </h2>

                <form id="quiz-form" onSubmit="saveQuestion(event)" class="space-y-4">
                    <input type="hidden" id="edit-index" value="-1">

                    <!-- Pertanyaan / Soal -->
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">Pertanyaan / Soal:</label>
                        <textarea id="input-q" rows="4" required placeholder="Tuliskan naskah pertanyaan di sini..." class="w-full input-light rounded-xl p-3 text-sm text-left font-normal"></textarea>
                    </div>

                    <!-- KOTAK MEDIA / GAMBAR SOAL -->
                    <div class="inner-panel p-4 rounded-xl space-y-3">
                        <div class="flex items-center text-blue-700 font-bold text-xs uppercase tracking-wide">
                            <i class="fa-regular fa-image mr-2"></i> Gambar / Embed Media (Opsional)
                        </div>

                        <div class="space-y-2">
                            <label class="block text-[11px] text-slate-500 font-medium">Pilih File dari Komputer ATAU Paste Kode HTML Embed / Link GDrive:</label>
                            
                            <div class="flex flex-col sm:flex-row gap-2">
                                <!-- Upload File Lokal -->
                                <input type="file" id="input-file" accept="image/*" onChange="handleFileUpload(event)"
                                    class="block w-full text-xs text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-blue-100 file:text-blue-800 hover:file:bg-blue-200 cursor-pointer border border-slate-300 rounded-lg bg-white p-1">
                                
                                <!-- Input Teks Embed HTML / Link Direct -->
                                <input type="text" id="input-embed-text" oninput="handleEmbedInput()" placeholder="Paste kode <iframe...> atau link di sini..." class="w-full input-light rounded-lg px-3 py-2 text-xs">
                            </div>
                        </div>

                        <!-- PREVIEW MEDIA UTUH -->
                        <div id="preview-box" class="mt-2 p-3 bg-slate-100 rounded-lg border border-slate-200 hidden">
                            <p class="text-[10px] text-slate-500 font-bold uppercase mb-2">Preview Media Soal:</p>
                            <div id="media-preview-content" class="flex justify-center items-center max-h-52 overflow-hidden rounded"></div>
                        </div>
                    </div>

                    <!-- PILIHAN JAWABAN -->
                    <div class="space-y-2.5 pt-1">
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Pilihan Jawaban (Tandai Kunci Jawaban Benar):</label>

                        <!-- Jawaban A -->
                        <div class="flex items-center gap-3 input-light p-2.5 rounded-xl hover:border-blue-300 transition">
                            <input type="radio" name="correct_opt" value="0" required class="w-4 h-4 accent-blue-600 cursor-pointer">
                            <span class="text-xs font-bold text-slate-600">A.</span>
                            <input type="text" id="opt-0" required placeholder="Jawaban A" class="w-full bg-transparent text-xs text-slate-800 focus:outline-none">
                        </div>

                        <!-- Jawaban B -->
                        <div class="flex items-center gap-3 input-light p-2.5 rounded-xl hover:border-blue-300 transition">
                            <input type="radio" name="correct_opt" value="1" class="w-4 h-4 accent-blue-600 cursor-pointer">
                            <span class="text-xs font-bold text-slate-600">B.</span>
                            <input type="text" id="opt-1" required placeholder="Jawaban B" class="w-full bg-transparent text-xs text-slate-800 focus:outline-none">
                        </div>

                        <!-- Jawaban C -->
                        <div class="flex items-center gap-3 input-light p-2.5 rounded-xl hover:border-blue-300 transition">
                            <input type="radio" name="correct_opt" value="2" class="w-4 h-4 accent-blue-600 cursor-pointer">
                            <span class="text-xs font-bold text-slate-600">C.</span>
                            <input type="text" id="opt-2" required placeholder="Jawaban C" class="w-full bg-transparent text-xs text-slate-800 focus:outline-none">
                        </div>

                        <!-- Jawaban D -->
                        <div class="flex items-center gap-3 input-light p-2.5 rounded-xl hover:border-blue-300 transition">
                            <input type="radio" name="correct_opt" value="3" class="w-4 h-4 accent-blue-600 cursor-pointer">
                            <span class="text-xs font-bold text-slate-600">D.</span>
                            <input type="text" id="opt-3" placeholder="Jawaban D" class="w-full bg-transparent text-xs text-slate-800 focus:outline-none">
                        </div>

                        <!-- Jawaban E -->
                        <div class="flex items-center gap-3 input-light p-2.5 rounded-xl hover:border-blue-300 transition">
                            <input type="radio" name="correct_opt" value="4" class="w-4 h-4 accent-blue-600 cursor-pointer">
                            <span class="text-xs font-bold text-slate-600">E.</span>
                            <input type="text" id="opt-4" placeholder="Jawaban E (Opsional)" class="w-full bg-transparent text-xs text-slate-800 focus:outline-none">
                        </div>
                    </div>

                    <button type="submit" id="btn-submit" class="w-full py-3 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-xl text-xs transition tracking-wider uppercase shadow-md mt-2">
                        + Tambahkan Soal ke Daftar
                    </button>
                </form>
            </section>

            <!-- KOLOM KANAN: DAFTAR SOAL -->
            <section class="lg:col-span-5 panel-bg p-6 rounded-2xl shadow-sm space-y-4 min-h-[500px]">
                <h2 class="text-base font-bold text-slate-800 border-b border-slate-200 pb-3 flex justify-between items-center">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-list-ol text-blue-700"></i> Daftar Soal</span>
                    <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-0.5 rounded-full border border-blue-200" id="total-count">0</span>
                </h2>

                <div id="empty-state" class="text-center py-20 text-slate-400 text-xs font-medium">
                    <i class="fa-solid fa-folder-open text-3xl mb-2 text-slate-300 block"></i>
                    Belum ada soal yang ditambahkan.
                </div>

                <div id="question-list" class="space-y-3 max-h-[600px] overflow-y-auto pr-1"></div>
            </section>

        </div>
    </div>

    <script>
        let questions = [];
        let finalHtmlMedia = "";

        // 1. Upload File Lokal (Base64)
        function handleFileUpload(e) {
            document.getElementById('input-embed-text').value = '';
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    finalHtmlMedia = `<img src="${evt.target.result}" alt="Gambar Soal" class="max-h-48 rounded object-contain border border-slate-200" />`;
                    renderPreview();
                };
                reader.readAsDataURL(file);
            } else {
                clearMedia();
            }
        }

        // 2. Input Teks Embed / Drive Link
        function handleEmbedInput() {
            document.getElementById('input-file').value = '';
            const val = document.getElementById('input-embed-text').value.trim();
            if (!val) {
                clearMedia();
                return;
            }

            if (val.includes('<iframe') || val.includes('<img')) {
                finalHtmlMedia = val;
            } else if (val.includes('drive.google.com')) {
                const match = val.match(/\/d\/([a-zA-Z0-9_-]+)/) || val.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    finalHtmlMedia = `<iframe src="https://drive.google.com/file/d/${match[1]}/preview" width="100%" height="200" allow="autoplay" class="rounded border border-slate-200"></iframe>`;
                } else {
                    finalHtmlMedia = val;
                }
            } else {
                finalHtmlMedia = `<img src="${val}" alt="Gambar Soal" class="max-h-48 rounded object-contain border border-slate-200" />`;
            }

            renderPreview();
        }

        function renderPreview() {
            const box = document.getElementById('preview-box');
            const container = document.getElementById('media-preview-content');
            box.classList.remove('hidden');
            container.innerHTML = finalHtmlMedia;
        }

        function clearMedia() {
            finalHtmlMedia = "";
            document.getElementById('preview-box').classList.add('hidden');
            document.getElementById('media-preview-content').innerHTML = "";
        }

        function saveQuestion(e) {
            e.preventDefault();

            const editIndex = parseInt(document.getElementById('edit-index').value);
            const qText = document.getElementById('input-q').value.trim();

            const options = [];
            for (let i = 0; i < 5; i++) {
                const val = document.getElementById(`opt-${i}`).value.trim();
                if (val !== "") options.push(val);
            }

            const selectedRadio = document.querySelector('input[name="correct_opt"]:checked');
            if (!selectedRadio) {
                alert("Pilih salah satu kunci jawaban!");
                return;
            }

            const answerIdx = parseInt(selectedRadio.value);
            if (answerIdx >= options.length) {
                alert("Pilihan kunci jawaban tidak boleh kosong!");
                return;
            }

            const data = {
                q: qText,
                embed_html: finalHtmlMedia,
                options: options,
                answer: answerIdx
            };

            if (editIndex === -1) {
                questions.push(data);
            } else {
                questions[editIndex] = data;
            }

            resetForm();
            renderList();
        }

        function renderList() {
            const listEl = document.getElementById('question-list');
            const emptyEl = document.getElementById('empty-state');
            document.getElementById('total-count').innerText = questions.length;

            if (questions.length === 0) {
                emptyEl.classList.remove('hidden');
                listEl.innerHTML = '';
                return;
            }

            emptyEl.classList.add('hidden');
            listEl.innerHTML = '';

            questions.forEach((q, i) => {
                const card = document.createElement('div');
                card.className = "inner-panel p-3.5 rounded-xl text-xs space-y-2 hover:border-blue-300 transition shadow-sm";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <span class="font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">Soal #${i + 1}</span>
                        <div class="flex gap-1.5">
                            <button onclick="editQuestion(${i})" class="px-2 py-0.5 bg-amber-100 text-amber-800 border border-amber-200 rounded hover:bg-amber-200 font-semibold transition">Edit</button>
                            <button onclick="deleteQuestion(${i})" class="px-2 py-0.5 bg-rose-100 text-rose-800 border border-rose-200 rounded hover:bg-rose-200 font-semibold transition">Hapus</button>
                        </div>
                    </div>
                    <p class="text-slate-700 line-clamp-2 text-left font-medium">${q.q}</p>
                `;
                listEl.appendChild(card);
            });
        }

        function editQuestion(i) {
            const q = questions[i];
            document.getElementById('edit-index').value = i;
            document.getElementById('input-q').value = q.q;

            document.getElementById('input-file').value = '';
            document.getElementById('input-embed-text').value = '';

            if (q.embed_html) {
                finalHtmlMedia = q.embed_html;
                if (!q.embed_html.includes('data:image')) {
                    document.getElementById('input-embed-text').value = q.embed_html;
                }
                renderPreview();
            } else {
                clearMedia();
            }

            for (let idx = 0; idx < 5; idx++) {
                document.getElementById(`opt-${idx}`).value = q.options[idx] || "";
            }

            const radios = document.getElementsByName('correct_opt');
            if (radios[q.answer]) radios[q.answer].checked = true;

            document.getElementById('btn-submit').innerText = "Update Soal";
        }

        function deleteQuestion(i) {
            if (confirm("Hapus soal ini dari daftar?")) {
                questions.splice(i, 1);
                renderList();
                resetForm();
            }
        }

        function resetForm() {
            document.getElementById('quiz-form').reset();
            document.getElementById('edit-index').value = -1;
            document.getElementById('btn-submit').innerText = "+ Tambahkan Soal ke Daftar";
            clearMedia();
        }

        // --- FITUR IMPORT WORD DENGAN TABEL ---
        function importWordTable(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                // Mengkonversi file Word (.docm/.docx) menjadi struktur HTML
                mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
                    .then(function(result) {
                        parseHtmlTable(result.value);
                    })
                    .catch(function(err) {
                        alert("Gagal membaca file Word! Pastikan file tidak rusak.");
                        console.error(err);
                    });
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }

        // Fungsi menguraikan tabel HTML dari Mammoth
        function parseHtmlTable(htmlString) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlString;

            const rows = tempDiv.querySelectorAll('tr');
            if (rows.length < 2) {
                alert("Tabel tidak ditemukan atau tabel kosong di dalam berkas Word!");
                return;
            }

            const newQuestions = [];
            const charMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3, 'E': 4, '1': 0, '2': 1, '3': 2, '4': 3, '5': 4 };

            rows.forEach((row, index) => {
                const cols = row.querySelectorAll('td, th');
                
                // Mengabaikan baris header atau baris yang kurang dari 8 kolom
                if (cols.length >= 8) {
                    const textNo = cols[0].innerText.trim();
                    const qText = cols[1].innerText.trim();
                    const optA = cols[2].innerText.trim();
                    const optB = cols[3].innerText.trim();
                    const optC = cols[4].innerText.trim();
                    const optD = cols[5].innerText.trim();
                    const optE = cols[6].innerText.trim();
                    const rawAns = cols[7].innerText.trim().toUpperCase();

                    // Abaikan baris header tabel
                    if (index === 0 && (textNo.toLowerCase().includes('no') || qText.toLowerCase().includes('soal'))) {
                        return;
                    }

                    if (qText) {
                        const options = [optA, optB, optC, optD, optE].filter(opt => opt !== "");
                        const ansIndex = charMap[rawAns] !== undefined ? charMap[rawAns] : 0;

                        newQuestions.push({
                            q: qText,
                            embed_html: "",
                            options: options,
                            answer: ansIndex
                        });
                    }
                }
            });

            if (newQuestions.length > 0) {
                questions = questions.concat(newQuestions);
                renderList();
                resetForm();
                alert(`Berhasil mengimpor ${newQuestions.length} soal dari tabel Word!`);
            } else {
                alert("Format tabel tidak cocok. Pastikan tabel memiliki minimal 8 kolom:\n1. No\n2. Soal\n3. Opt A\n4. Opt B\n5. Opt C\n6. Opt D\n7. Opt E\n8. Jawaban");
            }
        }

        // IMPOR / UPLOAD FILE JSON
        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    if (Array.isArray(importedData)) {
                        questions = importedData;
                        renderList();
                        resetForm();
                        alert(`Berhasil mengimpor ${questions.length} soal!`);
                    } else {
                        alert("Format JSON tidak valid! Pastikan berkas berisi daftar array soal.");
                    }
                } catch (err) {
                    alert("Gagal membaca file JSON. Pastikan format berkas benar.");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // EKSPOR / DOWNLOAD FILE JSON
        function exportJSON() {
            if (questions.length === 0) {
                alert("Belum ada soal untuk diunduh!");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(questions, null, 2));
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", "soal.json");
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
        }
    </script>
</body>
</html>
